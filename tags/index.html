		<style>/* This is an arbitrary CSS string added to the bundle */
/* =============================================
   kim.dev — THEME
   Minimal tech blog with blue accent pops
   ============================================= */

/* --- Tokens --- */
:root {
  --color-bg:           #f8f9fc;
  --color-surface:      #ffffff;
  --color-text:         #000000;
  --color-text-muted:   #6b7280;
  --color-border:       #e4e7f0;
  --color-border-light: #eef0f8;

  --color-accent:       #2563eb;
  --color-accent-hover: #1d4ed8;
  --color-accent-dim:   #dbeafe;
  --color-accent-mid:   #93c5fd;
  --color-accent-muted: #eff6ff;

  --color-tag-bg:   #dbeafe;
  --color-tag-text: #1e40af;

  --color-code-bg:   #eff6ff;
  --color-code-text: #1d4ed8;

  --font-sans:  'DM Sans', sans-serif;
  --font-serif: 'Lora', Georgia, serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', monospace;

  --font-family: -apple-system, system-ui, sans-serif;
  --font-family-monospace: Consolas, Menlo, Monaco, Andale Mono WT, Andale Mono, Lucida Console, Lucida Sans Typewriter, DejaVu Sans Mono, Bitstream Vera Sans Mono, Liberation Mono, Nimbus Mono L, Courier New, Courier, monospace;

  --max-width:        60em;
  --max-width-narrow: 60em;
  --space-section:    3.5rem;
}

/* --- Reset --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-family);
  font-size: 1rem;
  line-height: 1.6;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

video { max-width: 100%; height: auto; display: block; }
img { max-width: 100%; height: auto; }
a { color: var(--color-accent); text-decoration: none; }
a:hover { color: var(--color-accent-hover); text-decoration: underline; }

/* --- Layout --- */
.container { max-width: var(--max-width); margin-inline: auto; padding-inline: 2rem; }
.container--narrow { max-width: var(--max-width-narrow); }
.site-main { flex: 1; }

/* --- Header --- */
.site-header {
  padding-block: 1.25rem;
  border-bottom: 2px solid var(--color-accent);
  background: var(--color-surface);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(37, 99, 235, 0.08);
}
.site-header .container { display: flex; align-items: center; justify-content: space-between; }

.site-logo {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--color-accent);
  letter-spacing: 0.04em;
  text-transform: lowercase;
  transition: opacity 0.15s;
}
.site-logo:hover { opacity: 0.7; text-decoration: none; }

.site-nav { display: flex; gap: 2rem; align-items: center; }
.site-nav a {
  font-size: 0.875rem;
  color: var(--color-text-muted);
  letter-spacing: 0.02em;
  font-weight: 400;
  transition: color 0.15s;
}
.site-nav a:hover { color: var(--color-accent); text-decoration: none; }

/* --- Footer --- */
.site-footer {
  padding-block: 2rem;
  border-top: 1px solid var(--color-border);
  background: var(--color-surface);
}
.site-footer .container {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--color-text-muted);
}
.site-footer a { color: var(--color-accent); }
.footer-sep { color: var(--color-border); }

/* ─────────────────────────────────────────
   HERO BANNER
───────────────────────────────────────── */
.hero {
  position: relative;
  height: 33vh;
  min-height: 260px;
  max-height: 380px;
  overflow: hidden;
  background: #080e1c;
  display: flex;
  align-items: center;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(37,99,235,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37,99,235,0.06) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 100% 100% at 65% 50%, black 20%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 100% 100% at 65% 50%, black 20%, transparent 100%);
}

.hero-svg {
  position: absolute;
  right: -2%;
  top: 50%;
  transform: translateY(-50%);
  height: 115%;
  width: 62%;
}

.hero-content {
  position: relative;
  z-index: 10;
  padding: 0 2rem;
  max-width: var(--max-width);
  margin-inline: auto;
  width: 100%;
}

.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #93c5fd;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.hero-eyebrow::before {
  content: '';
  display: inline-block;
  width: 20px;
  height: 1px;
  background: #93c5fd;
}

.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(1.6rem, 3.2vw, 2.5rem);
  font-weight: 400;
  line-height: 1.18;
  letter-spacing: -0.025em;
  color: #eef2ff;
  max-width: 18ch;
  margin-bottom: 1rem;
}
.hero-title em { font-style: italic; color: #93c5fd; }

.hero-sub {
  font-size: 0.875rem;
  color: #475569;
  max-width: 36ch;
  line-height: 1.7;
  font-weight: 300;
}

/* ─────────────────────────────────────────
   HOME / POST LIST
───────────────────────────────────────── */
.home { padding-block: var(--space-section); }

.post-list-header {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--color-border);
}

.post-card {
  padding-block: 2.25rem;
  border-bottom: 1px solid var(--color-border-light);
  padding-left: 1.5rem;
  border-left: 3px solid transparent;
  transition: border-color 0.2s;
}
.post-card:hover { border-left-color: var(--color-accent); }

.post-card-meta {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--color-accent);
  letter-spacing: 0.06em;
  margin-bottom: 0.55rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.post-card-title {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 0.65rem;
}
.post-card-title a { color: var(--color-text); transition: color 0.15s; }
.post-card-title a:hover { color: var(--color-accent); text-decoration: none; }

.post-card-excerpt {
  font-size: 0.88rem;
  color: var(--color-text-muted);
  max-width: 60ch;
  line-height: 1.75;
}

.empty-state { color: var(--color-text-muted); font-style: italic; padding-block: 2rem; }

/* --- Tags --- */
.tag {
  background: var(--color-tag-bg);
  color: var(--color-tag-text);
  padding: 0.15em 0.65em;
  border-radius: 4px;
  font-size: 0.7rem;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.03em;
}

/* ─────────────────────────────────────────
   POST PAGE
───────────────────────────────────────── */
.post-header {
  padding-block: 4.5rem 3rem;
  border-bottom: 1px solid var(--color-border);
  margin-bottom: 3rem;
  background: linear-gradient(160deg, #eef3ff 0%, var(--color-bg) 60%);
}

.post-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--color-accent);
  letter-spacing: 0.06em;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.post-meta-sep { color: var(--color-border); }
.post-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }

.post-title {
  font-family: var(--font-serif);
  font-size: clamp(1.75rem, 4vw, 2.85rem);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}

.post-description {
  font-size: 1.05rem;
  color: var(--color-text-muted);
  line-height: 1.5;
  max-width: 52ch;
}

/* --- Post body typography --- */
.post-body {
	 padding-bottom: 5rem; 
	 max-width: 60em;
	 margin-inline: auto;
}

.post-body h2 {
  font-family: var(--font-sans);
  font-size: 1.6rem;
  font-weight: 600;
  margin-top: 2.5em;
  margin-bottom: 0.75em;
  letter-spacing: -0.01em;
  padding-left: 0.9rem;
  border-left: 3px solid var(--color-accent);
}
.post-body h3 {
  font-family: var(--font-sans);
  font-size: 1.2rem;
  font-weight: 600;
  margin-top: 2em;
  margin-bottom: 0.6em;
}
.post-body h4 {
  font-family: var(--font-sans);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--color-text-muted);
  margin-top: 1.5em;
  margin-bottom: 0.5em;
}

.post-body p { font-size: 1.0rem; line-height: 1.5; margin-bottom: 1.5em; }

.post-body a {
  color: var(--color-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--color-accent-mid);
}
.post-body a:hover { text-decoration-color: var(--color-accent-hover); }

.post-body strong { font-weight: 500; }
.post-body em { font-family: var(--font-serif); font-style: italic; }

.post-body ul,
.post-body ol {
  padding-left: 1.5em;
  margin-bottom: 1.5em;
  font-size: 1.08rem;
  line-height: 1.85;
}
.post-body li { margin-bottom: 0.4em; }

.post-body blockquote {
  margin: 2em 0;
  padding: 0.1em 0 0.1em 1.5em;
  border-left: 3px solid var(--color-accent-mid);
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 1.15rem;
  line-height: 1.75;
  color: var(--color-text-muted);
}
.post-body blockquote p { font-size: inherit; color: inherit; }

.post-body code {
  font-family: var(--font-mono);
  font-size: 0.875em;
  background: var(--color-code-bg);
  color: var(--color-code-text);
  padding: 0.15em 0.45em;
  border-radius: 4px;
  font-weight: 500;
}

.post-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 1.5rem;
  border-radius: 8px;
  overflow-x: auto;
  margin: 2em 0;
  font-family: var(--font-mono);
  font-size: 0.875rem;
  line-height: 1.7;
  border-left: 3px solid var(--color-accent);
}
.post-body pre code { background: transparent; color: inherit; padding: 0; font-weight: 400; }

.post-body hr { border: none; border-top: 1px solid var(--color-border); margin: 3em 0; }

.post-body figure { margin: 2.5em 0; }
.post-body figcaption {
  font-size: 0.75rem;
  color: var(--color-text-muted);
  font-family: var(--font-mono);
  margin-top: 0.75rem;
  letter-spacing: 0.02em;
}

.post-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin: 2em 0;
}
.post-body th {
  text-align: left;
  font-weight: 500;
  border-bottom: 2px solid var(--color-border);
  padding: 0.5em 1em 0.5em 0;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}
.post-body td {
  padding: 0.65em 1em 0.65em 0;
  border-bottom: 1px solid var(--color-border);
  vertical-align: top;
}

/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
@media (max-width: 640px) {
  .container { padding-inline: 1.25rem; }
  .site-header { padding-block: 1.1rem; }
  .site-nav { gap: 1.25rem; }
  .hero-svg { width: 70%; opacity: 0.55; }
  .hero-title { font-size: 1.5rem; }
  .home { padding-block: 2.5rem; }
  .post-header { padding-block: 3rem 2rem; margin-bottom: 2rem; }
  .post-card { padding-left: 1rem; }
  .post-body pre { padding: 1rem; margin-inline: -1.25rem; border-radius: 0; }
}

@media (min-width: 641px) and (max-width: 900px) {
  .container { padding-inline: 1.5rem; }
}</style>
